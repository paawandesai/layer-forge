modules:
  jira:issuePanel:
    - key: layer-blast-radius
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Blast radius
      icon: resource:icons;layer.svg
  jira:issueContext:
    - key: layer-blast-radius-context
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Blast radius
      label: Layer
      icon: resource:icons;layer.svg
  jira:projectPage:
    - key: layer-incoming
      resource: project
      resolver:
        function: resolver
      render: native
      title: Incoming changes
      icon: resource:icons;layer.svg
  jira:dashboardGadget:
    - key: layer-risk-gadget
      title: Contract risk
      description: Breaking API, event and schema changes in flight across your teams, and which teams have not been told yet.
      thumbnail: resource:icons;layer.svg
      resource: gadget
      resolver:
        function: resolver
      render: native
  jira:adminPage:
    - key: layer-admin
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Layer for Jira
      icon: resource:icons;layer.svg
  rovo:agent:
    - key: contract-steward
      name: Contract Steward
      description: Tells you which teams and services a code change will break, using
        Layer's contract graph.
      icon: resource:icons;layer.svg
      prompt: resource:prompts;agent.txt
      conversationStarters:
        - What does FERN-1 break?
        - What will this issue's pull requests break?
        - Who uses jobs-api in fernway-test/jobs-api?
        - What contract changes are coming to the APIs my team calls?
      actions:
        - get-contract-consumers
        - get-incoming-changes
        - get-issue-blast-radius
        - tell-consumers
  rovo:skill:
    - key: layer-contract-check
      source:
        dir: rovo-skills/layer-contract-check
      dependencies:
        tools:
          - get-contract-consumers
          - get-incoming-changes
          - get-issue-blast-radius
          - tell-consumers
  rovo:mcp:
    - key: layer-mcp
      name: Layer for Jira
      tools:
        - get-contract-consumers
        - get-incoming-changes
        - get-issue-blast-radius
  action:
    - key: get-contract-consumers
      name: Get contract consumers
      function: consumers
      actionVerb: GET
      description: When a user asks who uses, calls or depends on an API, event or
        database contract, list the repositories that consume it, with evidence
        and confidence.
      inputs:
        contract:
          title: Contract name
          type: string
          required: true
          description: The contract's name as declared in Layer, for example jobs-api.
        repo:
          title: Producer repository
          type: string
          required: true
          description: The repository that owns the contract, for example fernway-test/jobs-api. Ask the user if you do not know it.
    - key: get-incoming-changes
      name: Get incoming contract changes
      function: incoming
      actionVerb: GET
      description: When a user asks what changes are coming to the APIs or contracts a
        team or repository depends on, list in-flight and recent contract
        changes routed to it.
      inputs:
        repo:
          title: Consuming repository
          type: string
          required: false
          description: A consuming repository, for example fernway-test/web.
        owner:
          title: Owner handle
          type: string
          required: false
          description: A team handle from CODEOWNERS, for example @fernway-test/mobile.
        project:
          title: Jira project key
          type: string
          required: false
          description: A Jira project key such as FERN. Answers for the teams mapped to that project; defaults to the project being viewed when no repository or owner is given.
    - key: get-issue-blast-radius
      name: Get an issue's blast radius
      function: issueChanges
      actionVerb: GET
      description: When a user asks what a Jira issue's code changes will break or who
        they affect, list the contract changes in its pull requests and the
        consumers each one reaches.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: A Jira issue key such as JOBS-12. Defaults to the issue being viewed.
    - key: automation-check
      name: Check Layer blast radius
      function: automationCheck
      actionVerb: CREATE
      description: Comments on a Jira issue with the contract changes in its pull requests when another team's code will break, and can file issues for those teams.
      config:
        resource: automation
        render: native
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The issue to check, usually {{issue.key}}.
        tellTeams:
          title: Tell the affected teams
          type: string
          required: false
          description: yes to also file issues for the teams whose code will break.
    - key: tell-consumers
      name: Tell the affected teams
      function: tellConsumers
      actionVerb: CREATE
      description: Only after the user has seen the blast radius and agreed, file one
        linked Jira issue for each team whose repository will break because of a
        Jira issue's pull requests, or comment on the open issue Layer already
        filed for that team.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue whose code changes break other teams, such as FERN-1.
        dueDate:
          title: Due date
          type: string
          required: false
          description: Optional due date for the new issues, as YYYY-MM-DD.
  graph:connector:
    - key: layer-services
      name: Layer
      icons:
        light: resource:icons;layer.svg
        dark: resource:icons;layer.svg
      objectTypes:
        - atlassian:software-service
      datasource:
        onConnectionChange:
          function: graphConnectionChange
  scheduledTrigger:
    - key: layer-graph-refresh
      function: graphRefresh
      interval: hour
  automation:actionProvider:
    - key: layer-automation
      actions:
        - automation-check
  function:
    - key: automationCheck
      handler: index.automationCheck
    - key: graphConnectionChange
      handler: index.onGraphConnectionChange
    - key: graphRefresh
      handler: index.refreshGraph
    - key: resolver
      handler: index.handler
    - key: consumers
      handler: index.getConsumers
    - key: incoming
      handler: index.getIncomingChanges
    - key: tellConsumers
      handler: index.tellConsumersAction
    - key: issueChanges
      handler: index.getIssueChanges
resources:
  - key: panel
    path: src/frontend/panel.jsx
  - key: admin
    path: src/frontend/admin.jsx
  - key: automation
    path: src/frontend/automation.jsx
  - key: gadget
    path: src/frontend/gadget.jsx
  - key: project
    path: src/frontend/project.jsx
  - key: icons
    path: static/icons
  - key: prompts
    path: prompts
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/176a7b78-247a-4860-a77c-96c16250c304
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - manage:jira-project
    - manage:jira-configuration
    - read:object:jira
    - write:object:jira
    - delete:object:jira
  external:
    fetch:
      backend:
        - address: layer-api.fly.dev
